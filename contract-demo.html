function recycleBinPage(opts){const getDb=opts.getDb,pfx=opts.prefix;let rows=[...getDb()];content.innerHTML=`<div class="card"><div class="page-shell"><h1>回收站</h1><p>${opts.desc}</p></div><div class="filter-card"><div class="filter-head"><div><h2>筛选区</h2><p>按文件名称、编号、来源模块搜索已删除文件。</p></div></div><div class="search-row"><input id="${pfx}Search" placeholder="搜索文件名称、编号、来源模块"><button class="btn" type="button" id="${pfx}SearchBtn">搜索</button></div><div class="filter-tip" id="${pfx}Tip">当前回收站共 ${rows.length} 条记录。</div></div><div class="list-card"><div class="list-head"><h2>删除文件列表</h2><span style="font-size:13px;color:#64748b" id="${pfx}Count">共 ${rows.length} 条</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>来源模块</th><th>文件名称</th><th>文件编号</th><th>文件</th><th>删除时间</th><th>操作</th></tr></thead><tbody id="${pfx}Body"></tbody></table></div>${listPagerFooter(opts.pagerId)}</div></div>`;function filtered(){const q=(document.getElementById(pfx+"Search")?.value||"").trim().toLowerCase();return rows.filter(r=>!q||`${r.module}${r.name}${r.code}${r.file}`.toLowerCase().includes(q))}function render(slice){const db=getDb();document.getElementById(pfx+"Body").innerHTML=slice.length?slice.map(r=>{const idx=db.indexOf(r);return`<tr data-idx="${idx}"><td>${r.module||"—"}</td><td>${r.name||"—"}</td><td>${r.code||"—"}</td><td>${r.file||"—"}</td><td>${r.deletedAt||"—"}</td><td><div class="op-links"><button type="button" data-restore="${idx}">恢复记录</button><button type="button" data-purge="${idx}">彻底删除</button></div></td></tr>`}).join(""):`<tr><td colspan="6" style="text-align:center;padding:32px;color:#94a3b8">回收站暂无数据</td></tr>`;document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{const item=db[+b.dataset.restore];if(item?.raw&&item?.restoreTo){item.restoreTo.push(item.raw)}db.splice(+b.dataset.restore,1);rows=[...db];pager.reset();document.getElementById(pfx+"Tip").textContent="记录已恢复。"});document.querySelectorAll("[data-purge]").forEach(b=>b.onclick function setupListPager(footerId,cfg){const foot=document.getElementById(footerId);if(!foot)return{refresh:()=>{},reset:()=>{}};const sum=foot.querySelector(".pager-summary"),nums=foot.querySelector(".pager-nums"),jump=foot.querySelector(".pager-jump"),sizeSel=foot.querySelector(".pager-size");let page=1,size=cfg.size||10;function calc(){const all=cfg.getData()||[];const total=all.length,pages=Math.max(1,Math.ceil(total/size));if(page>pages)page=pages;const start=(page-1)*size;return{all,slice:all.slice(start,start+size),total,pages,start}}function paintNums(pages){let h="";const from=Math.max(1,Math.min(page-2,pages-4)),to=Math.min(pages,from+4);for(let i=from;i<=to;i++)h+=`<button type="button" class="pager-btn${i===page?" on":""}" data-pg="${i}">${i}</button>`;nums.innerHTML=h||`<button type="button" class="pager-btn on" data-pg="1">1</button>`;nums.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{page=+b.dataset.pg;draw()});jump.innerHTML=Array.from({length:pages},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");jump.value=page}function draw(){const m=calc();cfg.render(m.slice,m);const end=m.start+m.slice.length;sum.textContent=m.total?`共 ${m.total} 条，当前第 ${page}/${m.pages} 页`:"共 0 条";if(cfg.countEl){const el=typeof cfg.countEl==="string"?document.querySelector(cfg.countEl):cfg.countEl;if(el)el.textContent=`共 ${m.total} 条`}foot.querySelector("[data-p=prev]").disabled=page<=1;foot.querySelector("[data-p=next]").disabled=page>=m.pages;paintNums(m.pages)}foot.querySelector("[data-p=prev]").onclick=()=>{if(page>1){page--;draw()}};foot.querySelector("[data-p=next]").onclick=()=>{if(page<calc().pages){page++;draw()}};sizeSel.onchange=()=>{size=+sizeSel.value;page=1;draw()};jump.onchange=()=>{page=+jump.value||1;draw()};draw();return{refresh:draw,reset:()=>{page=1;draw()}}}

function applyFilter(list){const f=document.getElementById("qsFilter");if(!f)return list;const fd=new FormData(f),q=(document.getElementById("qsSearch")?.value||"").trim().toLowerCase();return list.filter(r=>{if(q&&!`${r.name}${r.code}${r.parties}${r.initiator}`.toLowerCase().includes(q))return false;if(fd.get("create")&&r.createDate!==fd.get("create"))return false;if(fd.get("status")&&r.status!==fd.get("status"))return false;if(fd.get("code")&&!r.code.includes(fd.get("code").trim()))return false;if(fd.get("initiator")&&!r.initiator.includes(fd.get("initiator").trim()))return false;if(fd.get("amount")&&r.amount<+fd.get("amount"))return false;return true})}
const qsCols=[{k:"name",l:"合同名称",def:true},{k:"code",l:"合同编号",def:true},{k:"file",l:"合同文件",def:true},{k:"sealStatus",l:"用印审批状态",def:false},{k:"status",l:"签署状态",def:true},{k:"startDate",l:"发起日期",def:true},{k:"entity",l:"发起主体",def:false},{k:"parties",l:"签署方",def:true},{k:"seal",l:"实际用印",def:false},{k:"ip",l:"IP地址",def:false},{k:"ipLoc",l:"IP属地",def:false}];
let colVis={};qsCols.forEach(c=>colVis[c.k]=c.def);colVis.chk=true;colVis.action=true;
function cellHtml(k,r){if(k==="name")return r.name;if(k==="code")return r.code;if(k==="file")return`<button type="button" class="link-btn" data-file="${r.id}">${r.file}</button>`;if(k==="sealStatus")return r.sealStatus;if(k==="status")return`<span class="st-badge ${stCls(r.status)}">${r.status}</span>`;if(k==="startDate")return r.startDate||"—";if(k==="entity")return r.entity;if(k==="parties")return r.parties;if(k==="seal")return r.seal;if(k==="ip")return r.ip;if(k==="ipLoc")return r.ipLoc;return""}
function applyColVis(){["chk","action",...qsCols.map(c=>c.k)].forEach(k=>{const show=colVis[k]!==false;document.querySelectorAll(`#qsTable [data-col="${k}"]`).forEach(el=>el.style.display=show?"":"none")})}
let qsPager;
function renderQsSlice(list){const tb=document.getElementById("qsBody");if(!tb)return;const colCount=2+qsCols.filter(c=>colVis[c.k]).length;tb.innerHTML=list.length?list.map(r=>{let tds=`<td data-col="chk" class="chk-col"><input type="checkbox" class="q-chk" ${r.status==="草稿"?"data-tpl":""}></td>`;qsCols.forEach(c=>{if(colVis[c.k])tds+=`<td data-col="${c.k}" class="col-${c.k}">${cellHtml(c.k,r)}</td>`});const op=side==="recycle"?`<button type="button" data-restore="${r.id}">恢复</button><button type="button" data-purge="${r.id}">彻底删除</button>`:`<button type="button" data-dl="${r.id}">下载</button><button type="button" data-void="${r.id}">作废</button><button type="button" data-pr="${r.id}">打印</button><button type="button" data-del="${r.id}">删除</button>`;tds+=`<td data-col="action" class="op-must col-op"><div class="op-links">${op}</div></td>`;return`<tr data-id="${r.id}">${tds}</tr>`}).join(""):`<tr><td colspan="${colCount}" style="text-align:center;padding:32px;color:#94a3b8">暂无数据</td></tr>`;applyColVis();bindTable()}

function bindTable(){const tip=document.getElementById("qsTip");document.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>openFile(+b.dataset.file));document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.dl);downloadText(r.file,"演示文件内容\n"+r.name)});document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.pr);const w=window.open("");w.document.write("<pre style='font-family:Microsoft YaHei;padding:24px'>"+r.name+"\n"+r.code+"</pre>");w.print()});document.querySelectorAll("[data-void]").forEach(b=>b.onclick=()=>{if(confirm("确认作废？")){find(+b.dataset.void).status="已作废";render()}});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=+b.dataset.del,r=find(id);if(!r)return;addRecycleItem({module:"合同快签",name:r.name,code:r.code,file:r.file,raw:r,restoreTo:data});r.deleted=true;data.splice(data.indexOf(r),1);render();tip.textContent="已移至系统回收站："+r.name});document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{const id=+b.dataset.restore,r=find(id);if(!r)return;r.deleted=false;recycle=recycle.filter(x=>x.id!==id);data.push(r);render();tip.textContent="已恢复："+r.name});document.querySelectorAll("[data-purge]").forEach(b=>b.onclick=()=>{const id=+b.dataset.purge,r=find(id);if(!r||!confirm("确认彻底删除？删除后无法恢复。"))return;recycle=recycle.filter(x=>x.id!==id);render();tip.textContent="已彻底删除："+r.name})}
function find(id){return data.find(x=>x.id===id)||recycle.find(x=>x.id===id)}
function openFile(id){const r=find(id);if(!r)return;curId=id;if(r.status==="草稿"){editId=id;openEsign(r);return}if(r.status==="签署中"&&r.handler)return openSignPage(r);openViewer(r)}

hk"?"chk-col":c.k==="action"?"col-op":""}">${c.k==="chk"?'<input type="checkbox" id="clAll"> 选择':c.l}</th>`).join("")}</tr></thead><tbody id="clBody"></tbody></table></div>${listPagerFooter("pagerCl")}</div></div></div>

<div class="modal-mask" id="clNegModal"><div class="modal neg-modal"><div class="modal-head"><h3>发起磋商</h3><button class="btn ghost" type="button" id="clNegX">×</button></div><div class="modal-body"><div class="seal-block"><h4>信息区</h4><div class="wf-grid wf-grid-2"><div class="field"><label>磋商类型</label><select id="negType"><option>条款磋商</option><option>价格磋商</option><option>综合磋商</option></select></div><div class="field"><label>磋商文件</label><input id="negFile" readonly></div><div class="field"><label>磋商开始时间</label><input type="datetime-local" id="negStart"></div><div class="field"><label>磋商结束时间</label><input type="datetime-local" id="negEnd"></div></div></div><div class="seal-block"><h4>磋商人员</h4><div class="wf-grid wf-grid-2"><div class="field"><label>磋商编辑人员</label><input id="negEditor" placeholder="可修改合同内容"></div><div class="field"><label>磋商查看人员</label><input id="negViewer" placeholder="仅查看并提出意见"></div></div></div><div class="seal-block"><h4>磋商意见</h4><div class="field"><textarea id="negOpinion" placeholder="请输入磋商意见" style="height:80px"></textarea></div><button class="btn ghost" type="button" id="negUpload">上传附件</button><input type="file" id="negFileUp" class="hidden-input"></div><div class="seal-block"><h4>磋商记录</h4><div class="neg-records"><table class="mini-table"><thead><tr><th>序号</th><th>磋商文件</th><th>磋商人员</th><th>修改意见</th><th>创建时间</th></tr></thead><tbody id="negRecords"></tbody></table></div></div><div class="field"><label>磋商结果</label><select id="negResult"><option>磋商中</option><option>一致通过</option><option>有争议</option><option>磋商超时</option></select></div></div><div class="modal-foot"><button class="btn ghost" type="button" id="clNegCancel">取消</button><button class="btn" type="button" id="clNegOk">确认</button></div></div></div>

const tip=document.getElementById("clTip");
function applyColVis(){clCols.forEach(c=>{const show=colVis[c.k]!==false;document.querySelectorAll(`#clTable [data-col="${c.k}"]`).forEach(el=>el.style.display=show?"":"none")})}
function renderNegRecords(r){document.getElementById("negRecords").innerHTML=(r.consultRecords||[]).length?r.consultRecords.map(x=>`<tr><td>${x.seq}</td><td>${x.file}</td><td>${x.person}</td><td>${x.opinion}</td><td>${x.time}</td></tr>`).join(""):`<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:16px">暂无磋商记录</td></tr>`}
let clPager;
function renderClSlice(slice){const tb=document.getElementById("clBody");tb.innerHTML=slice.length?slice.map(r=>`<tr data-id="${r.id}"><td data-col="chk" class="chk-col"><input type="checkbox" class="cl-chk"></td><td data-col="file"><button type="button" class="link-btn" data-preview="${r.id}">${r.file}</button></td><td data-col="code">${r.code}</td><td data-col="type">${r.type}</td><td data-col="tplDraft">${r.tplDraft}</td><td data-col="tplType">${r.tplType}</td><td data-col="approveStatus">${badge(r.approveStatus||"—",apMap[r.approveStatus]||"st-void")}</td><td data-col="consultStatus">${badge(r.consultStatus||"—",cgMap[r.consultStatus]||"st-void")}</td><td data-col="signStatus">${badge(r.signStatus,"st-signing")}</td><td data-col="contractStatus">${badge(r.contractStatus,r.contractStatus==="合同生效"?"st-done":r.contractStatus==="作废"?"st-reject":"st-draft")}</td><td data-col="action" class="col-op">${opHtml(r)}</td></tr>`).join(""):`<tr><td colspan="${clCols.length}" style="text-align:center;padding:32px;color:#94a3b8">暂无数据</td></tr>`;applyColVis();bindRows()}
function bindRows(){document.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>openPreview(+b.dataset.preview));document.querySelectorAll("[data-extract]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.extract);alert("要素抽取完成：\n合同名称："+r.name+"\n合同编号："+r.code+"\n供应商："+(r.supplier||"—"))});document.querySelectorAll("[data-appr]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.appr);if(!canApprove(r))return alert("请先定稿后再发起审批");if(confirm("确认发起审批？")){r.approveStatus="审批中";r.approveStart=r.approveStart||new Date().toISOString().slice(0,10);clPager.refresh();tip.textContent="已发起审批："+r.name}});document.querySelectorAll("[data-cons]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.cons);if(!canConsult(r))return;negId=r.id;document.getElementById("negFile").value=r.file;const now=new Date();document.getElementById("negStart").value=now.toISOString().slice(0,16);const end=new Date(now.getTime()+7*86400000);document.getElementById("negEnd").value=end.toISOString().slice(0,16);document.getElementById("negEditor").value=r.consultant||"";document.getElementById("negViewer").value="";document.getElementById("negOpinion").value="";document.getElementById("negResult").value=r.consultStatus==="—"?"磋商中":r.consultStatus;renderNegRecords(r);document.getElementById("clNegModal").classList.add("show")});document.querySelectorAll("[data-sign]").forEach(b=>b.onclick=()=>{const r=find(+b.dataset.sign);if(!canSign(r))return alert("需磋商一致通过后方可签署");go("quick")});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=+b.dataset.del;if(!confirm("确认删除该合同？"))return;const i=db.findIndex(x=>x.id===id);if(i>-1)db.splice(i,1);rows=filterRows();clPager.reset();tip.textContent="已删除合同"})}
function filterRows(){const f=new FormData(document.getElementById("clFilter")),q=document.getElementById("clSearch").value.trim().toLowerCase();return db.filter(r=>{if(q&&!`${r.name}${r.code}${r.supplier}${r.company}`.toLowerCase().includes(q))return false;if(f.get("name")&&!r.name.includes(f.get("name").trim()))return false;if(f.get("code")&&!r.code.includes(f.get("code").trim()))return false;if(f.get("type")&&r.type!==f.get("type"))return false;if(f.get("dept")&&r.dept!==f.get("dept"))return false;if(f.get("company")&&!r.company.includes(f.get("company").trim()))return false;if(f.get("companyCode")&&!r.companyCode.includes(f.get("companyCode").trim()))return false;if(f.get("supplier")&&!r.supplier.includes(f.get("supplier").trim()))return false;if(f.get("supplierCode")&&!r.supplierCode.includes(f.get("supplierCode").trim()))return false;if(f.get("approver")&&!r.approver.includes(f.get("approver").trim()))return false;if(f.get("consultant")&&!r.consultant.includes(f.get("consultant").trim()))return false;if(f.get("signer")&&!r.signer.includes(f.get("signer").trim()))return false;if(f.get("approveStatus")&&r.approveStatus!==f.get("approveStatus"))return false;if(f.get("consultStatus")&&r.consultStatus!==f.get("consultStatus"))return false;if(f.get("signStatus")&&r.signStatus!==f.get("signStatus"))return false;if(f.get("contractStatus")&&r.contractStatus!==f.get("contractStatus"))return false;if(f.get("payType")&&r.payType!==f.get("payType"))return false;if(f.get("templateCreate")&&r.templateCreate!==f.get("templateCreate"))return false;const amin=+f.get("amountMin"),amax=+f.get("amountMax");if(amin&&r.amount<amin)return false;if(amax&&r.amount>amax)return false;return true})}
function openPreview(id){const r=find(id);if(!r)return;previewId=id;previewEdit=false;document.getElementById("clPreviewTitle").textContent="预览 · "+r.file;document.getElementById("clWordRibbon").style.display="none";document.getElementById("clWordDoc").contentEditable="false";document.getElementById("clWordDoc").innerHTML=`<h1 style="text-align:center">${r.name}</h1><p><b>合同编号：</b>${r.code}</p><p><b>合同类型：</b>${r.type}</p><p>甲方：${r.company}</p><p>乙方：${r.supplier||"____________"}</p><p>正文预览区域。点击「编辑」进入 Word 在线编辑器模式。</p>`;document.getElementById("clPreview").classList.add("show")}

document.getElementById("clPassDemo").onclick=()=>{const ids=selIds();if(!ids.length){alert("请勾选审批中的合同");return}const list=ids.map(find).filter(r=>r&&r.approveStatus==="审批中");if(!list.length){alert("所选合同中没有「审批中」状态");return}list.forEach(r=>{r.approveStatus="通过";r.approveEnd=new Date().toISOString().slice(0,10)});clPager.refresh();tip.textContent="已标记 "+list.length+" 份合同审批通过，可发起磋商。"};

function templateDesigner(t){const base=["合同名称","合同编号","起草日期","甲方名称","乙方名称","合同总金额","币种","收付款方式","开始日期","结束日期","所属部门","经办人","关联项目","是否缴纳履约保证金"],extra={"服务类合同":["服务描述","计费方式","交付物","附件上传"],"采购类合同":["物料名称","规格型号","数量","单价","结算方式","质保时长","质保金比例","售后响应时间","仓库地址","联系人","附件上传"],"工程类合同":["施工地点","工期天数","开工日期","竣工日期","是否允许分包","安全生产协议编号","安全责任保证金","验收阶段","附件上传"],"物流类合同":["起运点","目的地","途径点","货物名称","重量/体积","包装方式","是否属于危险品/易碎品","运输车型要求","运输时效","运费单价","路桥承担方","装卸费承担方","保价金额","货损赔偿标准","延时违约金规则","附件上传"],"租赁合同":["建筑面积/品牌","套内面积/型号","具体地址/机身编号","房产证号/货损状态","起租日期","免租期","租金支付周期","调价机制","租赁押金金额","水电物业/维修保养责任","交付时验收清单","退租还原要求","附件上传"],"协议类合同":["合作起始时间","合作截至时间","价格清单","折扣率","调价触发条件","销售额/年度保底采购量","返利标准","订单下达方式","是否独家","竞争对手限制","附件上传"],"销售类合同":["预付款比例","发货款","验收款","尾款","发货前置条件","物流承担方","退货周期","折旧扣除规则","附件上传"],"劳动合同":["职位名称","所属部门","职级","基本工资","绩效比例","试用期薪资","试用期时长","转正考核标准","工时制度","附件上传"]};function field(n){if(n.includes("日期")||n.includes("时间"))return `<div class="field"><label>${n}</label><input type="date"></div>`;if(n==="收付款方式")return `<div class="field"><label>${n}</label><select><option>三方支付</option><option>银行转账</option><option>现金支付</option></select></div>`;if(n==="计费方式")return `<div class="field"><label>${n}</label><select><option>人天单价</option><option>按月结算</option><option>成果结算</option></select></div>`;if(n==="验收阶段")return `<div class="field"><label>${n}</label><select><option>隐蔽工程验收</option><option>中间验收</option><option>竣工验收</option></select></div>`;if(n==="退租还原要求")return `<div class="field"><label>${n}</label><select><option>原状恢复</option><option>现状退租</option></select></div>`;if(n.includes("附件"))return `<div class="field"><label>${n}</label><input type="file"></div>`;return `<div class="field"><label>${n}</label><input placeholder="请输入${n}"></div>`}content.innerHTML=`<div class="card"><div class="toolbar"><button class="btn" id="saveTpl">保存</button><button class="btn ghost" id="backTpl">返回模板列表</button></div><div class="tpl-editor"><div class="editor-shell"><div class="paper" contenteditable="true"><h1>${t.name}</h1><p>本合同模板适用于${t.type}。</p><p>甲方：{{甲方名称}}</p><p>乙方：{{乙方名称}}</p><p>合同金额：{{合同总金额}} {{币种}}</p></div></div><aside class="tpl-fields"><div class="tpl-section"><h4>基础信息区</h4>${base.map(field).join("")}</div><div class="tpl-section"><h4>${t.type}字段区</h4>${(extra[t.type]||[]).map(field).join("")}</div></aside></div></div>`;document.getElementById("saveTpl").onclick=()=>{const paper=document.querySelector(".tpl-editor .paper");const nm=(paper?.querySelector("h1")?.textContent||"模板起草合同").replace("模板","").trim()||"模板起草合同";pushDraftContract({name:nm,type:t.type,tplDraft:"是",tplType:t.name,templateCreate:"是",file:nm+".docx"});alert("已保存至合同列表（草稿状态）");go("list")};document.getElementById("backTpl").onclick=templateDraft}
function templateDocHtml(type,data={}){const g=k=>data[k]||`{{${k}}}`;const money=`人民币（大写）${g("合同总金额")}元整（¥${g("合同总金额")}，${g("币种")||"人民币"}）`;const head=(title)=>`<h1>${title}</h1><p class="doc-no">合同编号：<span data-bind="合同编号">${g("合同编号")}</span></p><div class="party-block"><p><strong>甲方：</strong><span data-bind="甲方名称">${g("甲方名称")}</span></p><p><strong>乙方：</strong><span data-bind="乙方名称">${g("乙方名称")}</span></p><p><strong>起草日期：</strong><span data-bind="起草日期">${g("起草日期")}</span>　<strong>经办部门：</strong><span data-bind="所属部门">${g("所属部门")}</span>　<strong>经办人：</strong><span data-bind="经办人">${g("经办人")}</span></p></div>`;const tail=`<div class="sign-grid"><div><p><strong>甲方（盖章）：</strong><span data-bind="甲方名称">${g("甲方名称")}</span></p><p>法定代表人或授权代表：________________</p><p>签订日期：____年____月____日</p></div><div><p><strong>乙方（盖章）：</strong><span data-bind="乙方名称">${g("乙方名称")}</span></p><p>法定代表人或授权代表：________________</p><p>签订日期：____年____月____日</p></div></div>`;
if(type==="采购类合同")return`${head(g("合同名称")||"采购合同")}<p>双方依据《中华人民共和国民法典》及相关法律法规，就甲方向乙方采购货物事宜协商一致，订立本合同。</p><p class="article-title">第一条　采购标的</p><table><thead><tr><th>物料名称</th><th>规格型号</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody><tr><td><span data-bind="物料名称">${g("物料名称")}</span></td><td><span data-bind="规格型号">${g("规格型号")}</span></td><td><span data-bind="数量">${g("数量")}</span></td><td><span data-bind="单价">${g("单价")}</span></td><td><span data-bind="合同总金额">${g("合同总金额")}</span></td></tr></tbody></table><p class="article-title">第二条　合同价款</p><p>合同总价为${money}，结算方式为<span data-bind="结算方式">${g("结算方式")}</span>。</p><p class="article-title">第三条　交付与验收</p><p>乙方应按约定将货物送达<span data-bind="仓库地址">${g("仓库地址")}</span>，联系人为<span data-bind="联系人">${g("联系人")}</span>。甲方按规格、数量、质量证明文件组织验收。</p><p class="article-title">第四条　质保与售后</p><p>质保期为<span data-bind="质保时长">${g("质保时长")}</span>，质保金比例为<span data-bind="质保金比例">${g("质保金比例")}</span>，售后响应时间为<span data-bind="售后响应时间">${g("售后响应时间")}</span>。</p><p class="article-title">第五条　违约责任与争议解决</p><p>任何一方违约应赔偿守约方损失；争议协商不成的，提交甲方所在地人民法院处理。</p>${tail}`;
if(type==="工程类合同")return`${head(g("合同名称")||"建设工程施工合同")}<p>双方就工程施工事项订立本合同。</p><p class="article-title">第一条　工程概况</p><p>工程地点：<span data-bind="施工地点">${g("施工地点")}</span>；工期：<span data-bind="工期天数">${g("工期天数")}</span>天，自<span data-bind="开工日期">${g("开工日期")}</span>开工，至<span data-bind="竣工日期">${g("竣工日期")}</span>竣工。</p><p class="article-title">第二条　合同价款</p><p>${money}。</p><p class="article-title">第三条　质量、安全与验收</p><p>乙方应严格遵守安全生产要求，安全生产协议编号为<span data-bind="安全生产协议编号">${g("安全生产协议编号")}</span>，验收阶段为<span data-bind="验收阶段">${g("验收阶段")}</span>。</p><p class="article-title">第四条　分包与保证金</p><p>是否允许分包：<span data-bind="是否允许分包">${g("是否允许分包")}</span>；安全责任保证金：<span data-bind="安全责任保证金">${g("安全责任保证金")}</span>。</p>${tail}`;
if(type==="物流类合同")return`${head(g("合同名称")||"物流运输服务合同")}<p>双方就货物运输服务事项达成本合同。</p><p class="article-title">第一条　运输信息</p><p>起运点：<span data-bind="起运点">${g("起运点")}</span>；目的地：<span data-bind="目的地">${g("目的地")}</span>；途径点：<span data-bind="途径点">${g("途径点")}</span>。</p><p class="article-title">第二条　货物与车辆要求</p><p>货物名称：<span data-bind="货物名称">${g("货物名称")}</span>；重量/体积：<span data-bind="重量/体积">${g("重量/体积")}</span>；包装方式：<span data-bind="包装方式">${g("包装方式")}</span>；车型要求：<span data-bind="运输车型要求">${g("运输车型要求")}</span>。</p><p class="article-title">第三条　费用与责任</p><p>运费单价为<span data-bind="运费单价">${g("运费单价")}</span>，路桥费由<span data-bind="路桥承担方">${g("路桥承担方")}</span>承担，装卸费由<span data-bind="装卸费承担方">${g("装卸费承担方")}</span>承担。</p><p class="article-title">第四条　时效与赔偿</p><p>运输时效：<span data-bind="运输时效">${g("运输时效")}</span>；保价金额：<span data-bind="保价金额">${g("保价金额")}</span>；货损赔偿标准：<span data-bind="货损赔偿标准">${g("货损赔偿标准")}</span>。</p>${tail}`;
if(type==="租赁合同")return`${head(g("合同名称")||"租赁合同")}<p>双方就租赁标的使用及费用结算订立本合同。</p><p class="article-title">第一条　租赁标的</p><p>租赁标的面积/型号：<span data-bind="建筑面积/品牌">${g("建筑面积/品牌")}</span>；具体地址/机身编号：<span data-bind="具体地址/机身编号">${g("具体地址/机身编号")}</span>；权属/状态：<span data-bind="房产证号/货损状态">${g("房产证号/货损状态")}</span>。</p><p class="article-title">第二条　租期与费用</p><p>起租日期为<span data-bind="起租日期">${g("起租日期")}</span>，免租期为<span data-bind="免租期">${g("免租期")}</span>，租金支付周期为<span data-bind="租金支付周期">${g("租金支付周期")}</span>，押金为<span data-bind="租赁押金金额">${g("租赁押金金额")}</span>。</p><p class="article-title">第三条　交付、维修与退租</p><p>水电物业/维修保养责任：<span data-bind="水电物业/维修保养责任">${g("水电物业/维修保养责任")}</span>；退租还原要求：<span data-bind="退租还原要求">${g("退租还原要求")}</span>。</p>${tail}`;
if(type==="协议类合同")return`${head(g("合同名称")||"合作协议")}<p>双方基于优势互补、诚实信用原则开展合作。</p><p class="article-title">第一条　合作期限</p><p>合作期限自<span data-bind="合作起始时间">${g("合作起始时间")}</span>起至<span data-bind="合作截至时间">${g("合作截至时间")}</span>止。</p><p class="article-title">第二条　商务政策</p><p>价格清单：<span data-bind="价格清单">${g("价格清单")}</span>；折扣率：<span data-bind="折扣率">${g("折扣率")}</span>；调价触发条件：<span data-bind="调价触发条件">${g("调价触发条件")}</span>。</p><p class="article-title">第三条　业务约定</p><p>年度保底/销售额：<span data-bind="销售额/年度保底采购量">${g("销售额/年度保底采购量")}</span>；返利标准：<span data-bind="返利标准">${g("返利标准")}</span>；订单下达方式：<span data-bind="订单下达方式">${g("订单下达方式")}</span>；是否独家：<span data-bind="是否独家">${g("是否独家")}</span>。</p>${tail}`;
if(type==="销售类合同")return`${head(g("合同名称")||"销售合同")}<p>双方就甲方向乙方销售产品事宜订立本合同。</p><p class="article-title">第一条　产品与价款</p><p>合同总价为${money}。</p><p class="article-title">第二条　付款节点</p><p>预付款比例：<span data-bind="预付款比例">${g("预付款比例")}</span>；发货款：<span data-bind="发货款">${g("发货款")}</span>；验收款：<span data-bind="验收款">${g("验收款")}</span>；尾款：<span data-bind="尾款">${g("尾款")}</span>。</p><p class="article-title">第三条　交付与退货</p><p>发货前置条件：<span data-bind="发货前置条件">${g("发货前置条件")}</span>；物流承担方：<span data-bind="物流承担方">${g("物流承担方")}</span>；退货周期：<span data-bind="退货周期">${g("退货周期")}</span>；折旧扣除规则：<span data-bind="折旧扣除规则">${g("折旧扣除规则")}</span>。</p>${tail}`;
if(type==="劳动合同")return`${head(g("合同名称")||"劳动合同")}<p>甲乙双方依据劳动法律法规建立劳动关系。</p><p class="article-title">第一条　岗位与期限</p><p>乙方职位为<span data-bind="职位名称">${g("职位名称")}</span>，所属部门为<span data-bind="所属部门">${g("所属部门")}</span>，职级为<span data-bind="职级">${g("职级")}</span>。合同期限自<span data-bind="开始日期">${g("开始日期")}</span>至<span data-bind="结束日期">${g("结束日期")}</span>。</p><p class="article-title">第二条　薪酬与试用期</p><p>基本工资：<span data-bind="基本工资">${g("基本工资")}</span>；绩效比例：<span data-bind="绩效比例">${g("绩效比例")}</span>；试用期薪资：<span data-bind="试用期薪资">${g("试用期薪资")}</span>；试用期时长：<span data-bind="试用期时长">${g("试用期时长")}</span>。</p><p class="article-title">第三条　工时与考核</p><p>工时制度：<span data-bind="工时制度">${g("工时制度")}</span>；转正考核标准：<span data-bind="转正考核标准">${g("转正考核标准")}</span>。</p>${tail}`;
return`${head(g("合同名称")||"服务合同")}<p>双方就服务委托事项达成本合同。</p><p class="article-title">第一条　服务内容</p><p>服务描述：<span data-bind="服务描述">${g("服务描述")}</span>；交付物：<span data-bind="交付物">${g("交付物")}</span>。</p><p class="article-title">第二条　服务期限与价款</p><p>服务期限自<span data-bind="开始日期">${g("开始日期")}</span>至<span data-bind="结束日期">${g("结束日期")}</span>。计费方式为<span data-bind="计费方式">${g("计费方式")}</span>，合同价款为${money}。</p><p class="article-title">第三条　验收与付款</p><p>甲方根据服务成果、交付物及双方确认的验收标准组织验收，并按<span data-bind="收付款方式">${g("收付款方式")}</span>方式支付。</p>${tail}`}
function templateDraft(){const baseCats=["全部","服务类合同","采购类合同","工程类合同","物流类合同","租赁合同","协议类合同","销售类合同","劳动合同"],cats=[...baseCats,...getApprovedTemplateTypes().filter(t=>!baseCats.includes(t))],fieldLib=getTemplateFieldLib(),tpls=cats.slice(1).map((c,i)=>({id:i,type:c,name:c.replace("类","")+"标准模板",desc:"按"+c+"真实业务条款生成，可在编辑页填写字段并同步到正文。"}));content.innerHTML=`<div class="card"><div class="page-shell"><h1>模板起草</h1><p>选择合同模板后点击编辑，或在模板字段库中设计新模板字段，提交后进入合同审批，由法务审批通过后自动作为合同类型展示。</p></div><div class="tpl-layout"><aside class="tpl-side">${cats.map((c,i)=>`<button class="tpl-cat ${i===0?"active":""}" data-cat="${c}">${c}</button>`).join("")}</aside><section class="tpl-main"><div class="toolbar" style="padding:0 0 18px;background:transparent;border:0"><button class="btn" type="button" id="openFieldLib">模板字段库</button><span style="font-size:13px;color:#64748b">字段库可扩展模板类型，重复类型归入已有分类，新类型审批通过后加入左侧分类和待办合同类型下拉。</span></div><div class="tpl-grid" id="tplGrid"></div></section></div><div class="modal-mask" id="fieldLibModal"><div class="modal" style="width:min(980px,96vw);max-height:92vh;display:flex;flex-direction:column"><div class="modal-head"><h3>模板字段库 / 设计模板</h3><button class="btn ghost" type="button" id="fieldLibClose">×</button></div><div class="modal-body" style="overflow:auto"><div class="wf-grid wf-grid-2"><div class="field"><label>模板名称</label><input id="libTplName" placeholder="如：数据合规服务合同模板"></div><div class="field"><label>字段类型 / 模板类型</label><input id="libTplType" placeholder="如：数据合规合同"></div></div><div class="field"><label>模板说明</label><textarea id="libTplDesc" placeholder="请输入模板用途、适用业务和审批说明"></textarea></div><div class="tpl-section"><h4>选择字段</h4>${Object.entries(fieldLib).map(([k,arr])=>`<div style="margin-bottom:14px"><h4 style="font-size:13px;margin-bottom:8px;color:#334155">${k}</h4><div class="field-options">${arr.map(f=>`<label><input type="checkbox" data-lib-field="${f}" data-lib-cat="${k}">${f}</label>`).join("")}</div></div>`).join("")}</div></div><div class="modal-foot"><button class="btn ghost" type="button" id="fieldLibCancel">取消</button><button class="btn" type="button" id="fieldLibSubmit">提交法务审批</button></div></div></div><div class="modal-mask" id="previewModal"><div class="modal" style="width:min(860px,96vw)"><div class="modal-head"><h3>模板预览</h3><button class="btn ghost" type="button" id="previewClose">×</button></div><div class="modal-body" id="previewBody" style="max-height:70vh;overflow:auto;background:#eef2f7"><div class="paper" style="width:100%;min-height:auto;box-shadow:none"></div></div><div class="modal-foot"><button class="btn ghost" type="button" id="previewPrint">打印</button><button class="btn" type="button" id="previewDownload">下载</button></div></div></div></div>`;const grid=document.getElementById("tplGrid");function render(cat="全部"){grid.innerHTML=tpls.filter(t=>cat==="全部"||t.type===cat).map(t=>`<div class="tpl-card"><h3>${t.name}</h3><p>${t.desc}</p><p>类型：${t.type}</p><div class="tpl-mask"><button class="btn" type="button" data-edit="${t.id}">编辑</button><button class="btn ghost" type="button" data-preview="${t.id}">预览</button></div></div>`).join("");grid.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>templateDesigner(tpls[+b.dataset.edit]));grid.querySelectorAll("[data-preview]").forEach(b=>b.onclick=()=>{const t=tpls[+b.dataset.preview];document.querySelector("#previewBody .paper").innerHTML=templateDocHtml(t.type,{"合同名称":t.name,"合同编号":"HT-TPL-2026-0001","甲方名称":"华东集团有限公司","乙方名称":"示例供应商有限公司","合同总金额":"100000","币种":"人民币","起草日期":new Date().toISOString().slice(0,10),"所属部门":"业务部门","经办人":"管理员"});document.getElementById("previewModal").classList.add("show")})}document.querySelectorAll(".tpl-cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tpl-cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.cat)});document.getElementById("openFieldLib").onclick=()=>document.getElementById("fieldLibModal").classList.add("show");document.getElementById("fieldLibClose").onclick=document.getElementById("fieldLibCancel").onclick=()=>document.getElementById("fieldLibModal").classList.remove("show");document.getElementById("fieldLibSubmit").onclick=()=>{const name=document.getElementById("libTplName").value.trim(),type=document.getElementById("libTplType").value.trim(),desc=document.getElementById("libTplDesc").value.trim(),fields=[...document.querySelectorAll("[data-lib-field]:checked")].map(x=>x.dataset.libField);if(!name||!type){alert("请填写模板名称和字段类型/模板类型");return}if(!fields.length){alert("请至少选择一个字段");return}const exists=cats.includes(type);if(!__templateFieldLib[type])__templateFieldLib[type]=[];fields.forEach(f=>{if(!__templateFieldLib[type].includes(f))__templateFieldLib[type].push(f)});addTemplateApproval({id:9000+__templateApprovalRows.length,name,code:"TPL-APP-"+String(__templateApprovalRows.length+1).padStart(3,"0"),type,start:new Date().toLocaleString("zh-CN",{hour12:false}).replace(/\//g,"-"),approveStatus:"审批中",fields,desc});document.getElementById("fieldLibModal").classList.remove("show");alert((exists?"字段已添加到已有类型：":"新模板类型已提交审批：")+type+"。请到待办合同页进行法务审批，通过后新类型将加入下拉和模板分类。");};document.getElementById("previewClose").onclick=()=>document.getElementById("previewModal").classList.remove("show");document.getElementById("previewPrint").onclick=()=>window.print();document.getElementById("previewDownload").onclick=()=>downloadText("模板预览.txt",document.querySelector("#previewBody .paper").innerText);render()}
function templateDesigner(t){const base=["合同名称","合同编号","起草日期","甲方名称","乙方名称","合同总金额","币种","收付款方式","开始日期","结束日期","所属部门","经办人","关联项目","是否缴纳履约保证金"],extra={"服务类合同":["服务描述","计费方式","交付物","附件上传"],"采购类合同":["物料名称","规格型号","数量","单价","结算方式","质保时长","质保金比例","售后响应时间","仓库地址","联系人","附件上传"],"工程类合同":["施工地点","工期天数","开工日期","竣工日期","是否允许分包","安全生产协议编号","安全责任保证金","验收阶段","附件上传"],"物流类合同":["起运点","目的地","途径点","货物名称","重量/体积","包装方式","是否属于危险品/易碎品","运输车型要求","运输时效","运费单价","路桥承担方","装卸费承担方","保价金额","货损赔偿标准","延时违约金规则","附件上传"],"租赁合同":["建筑面积/品牌","套内面积/型号","具体地址/机身编号","房产证号/货损状态","起租日期","免租期","租金支付周期","调价机制","租赁押金金额","水电物业/维修保养责任","交付时验收清单","退租还原要求","附件上传"],"协议类合同":["合作起始时间","合作截至时间","价格清单","折扣率","调价触发条件","销售额/年度保底采购量","返利标准","订单下达方式","是否独家","竞争对手限制","附件上传"],"销售类合同":["预付款比例","发货款","验收款","尾款","发货前置条件","物流承担方","退货周期","折旧扣除规则","附件上传"],"劳动合同":["职位名称","职级","基本工资","绩效比例","试用期薪资","试用期时长","转正考核标准","工时制度","附件上传"]};const defaults={"合同名称":t.name.replace("标准模板","")||t.name,"合同编号":"HT-TPL-2026-____","起草日期":new Date().toISOString().slice(0,10),"甲方名称":"华东集团有限公司","乙方名称":"","合同总金额":"","币种":"人民币","所属部门":"业务部门","经办人":"管理员"};function field(n){if(n.includes("附件"))return`<div class="field"><label>${n}</label><input type="file" data-file-field="${n}"></div>`;const type=n.includes("日期")||n.includes("时间")?"date":n.includes("金额")||n.includes("数量")||n.includes("单价")||n.includes("比例")||n.includes("天数")||n.includes("薪资")||n.includes("工资")?"number":"text";return`<div class="field"><label>${n}</label><input type="${type}" data-tpl-field="${n}" value="${defaults[n]||""}" placeholder="请输入${n}"></div>`}const fields=[...base,...(extra[t.type]||[])];content.innerHTML=`<div class="card"><div class="toolbar"><button class="btn" type="button" id="saveTpl">保存</button><button class="btn ghost" type="button" id="backTpl">返回模板列表</button><button class="btn ghost" type="button" id="printTpl">打印</button><button class="btn ghost" type="button" id="downTpl">下载</button><span style="font-size:13px;color:#64748b">当前模板：${t.type}，右侧字段修改会自动同步到正文占位位置</span></div><div class="tpl-editor"><div class="editor-shell"><div class="paper" id="tplPaper" contenteditable="true"></div></div><aside class="tpl-fields"><div class="tpl-section"><h4>基础信息区</h4>${base.map(field).join("")}</div><div class="tpl-section"><h4>${t.type}字段区</h4>${(extra[t.type]||[]).map(field).join("")}</div></aside></div></div>`;const data={...defaults};function draw(){document.getElementById("tplPaper").innerHTML=templateDocHtml(t.type,data)}function sync(k,v){data[k]=v;document.querySelectorAll(`[data-bind="${CSS.escape(k)}"]`).forEach(el=>el.textContent=v||`{{${k}}}`);if(k==="合同名称"){const h=document.querySelector("#tplPaper h1");if(h)h.textContent=v||t.name}}draw();document.querySelectorAll("[data-tpl-field]").forEach(i=>{i.oninput=()=>sync(i.dataset.tplField,i.value);if(i.value)sync(i.dataset.tplField,i.value)});document.querySelectorAll("[data-file-field]").forEach(i=>i.onchange=()=>{if(i.files[0])alert("已选择附件："+i.files[0].name)});document.getElementById("saveTpl").onclick=()=>{const nm=(data["合同名称"]||t.name).trim();pushDraftContract({name:nm,type:t.type,tplDraft:"是",tplType:t.name,templateCreate:"是",file:nm+".docx"});alert("已保存至合同列表（草稿状态）");go("list")};document.getElementById("backTpl").onclick=templateDraft;document.getElementById("printTpl").onclick=()=>window.print();document.getElementById("downTpl").onclick=()=>downloadText((data["合同名称"]||t.name)+".txt",document.getElementById("tplPaper").innerText)}
function downloadText(name,text){const blob=new Blob([text],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
go("project");
</script>
