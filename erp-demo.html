const Gate={
  chain(type){return (RULES.chains[type]||[]).slice();},
  init(doc,type){
    if(!doc)return;
    doc.gateType=type;
    const ch=this.chain(type);
    doc.nodes=ch.map(rid=>{const r=roleById(rid);return {roleId:rid,role:r?r.title:"",name:r?r.name:"",s:"待处理",t:"—"};});
    if(!doc.nodes.length){doc.approveStatus="通过";return;}
    doc.approveStatus="审批中";doc.nodes[0].s="进行中";
  },
  pending(doc){return (doc&&doc.nodes||[]).find(n=>n.s==="进行中")||null;},
  isDone(doc){if(!doc)return false;if(!doc.nodes||!doc.nodes.length)return doc.approveStatus==="通过"||doc.approveStatus==="已通过"||doc.status==="已通过";return doc.nodes.every(n=>n.s==="已通过");},
  isRejected(doc){return !!(doc&&(doc.approveStatus==="已驳回"||doc.status==="已驳回"||(doc.nodes||[]).some(n=>n.s==="已驳回")));},
  canAct(doc){
    if(this.isDone(doc))return {ok:false,msg:"该单已审批完成"};
    if(this.isRejected(doc))return {ok:false,msg:"该单已驳回"};
    const n=this.pending(doc);if(!n)return {ok:false,msg:"没有待处理节点"};
    if(n.roleId!==ROLE.id)return {ok:false,msg:"当前节点应由「"+n.name+" · "+n.role+"」处理，请先切换角色"};
    return {ok:true,node:n};
  },
  pass(doc){
    const chk=this.canAct(doc);if(!chk.ok){toast(chk.msg,"err");return false;}
    chk.node.s="已通过";chk.node.t=nowStr();chk.node.by=ROLE.name;
    const next=(doc.nodes||[]).find(x=>x.s==="待处理");
    if(next){next.s="进行中";doc.approveStatus="审批中";toast("已通过，下一节点："+next.name+" · "+next.role,"ok");}
    else{doc.approveStatus="通过";toast("审批完成","ok");}
    return true;
  },
  reject(doc){
    const chk=this.canAct(doc);if(!chk.ok){toast(chk.msg,"err");return false;}
    chk.node.s="已驳回";chk.node.t=nowStr();chk.node.by=ROLE.name;
    doc.approveStatus="已驳回";doc.status=doc.status&&doc.status!=="审批中"?doc.status:"已驳回";
    toast("已驳回，下游单据不得生成","err");return true;
  },
  mustDone(doc,label){
    if(this.isRejected(doc)){toast((label||"单据")+"已驳回，不能继续","err");return false;}
    if(this.isDone(doc))return true;
    const n=this.pending(doc);
    toast((label||"单据")+"未完成审批"+(n?("，当前节点："+n.name+" · "+n.role):""),"err");
    return false;
  },
  budgetOf(){return DB.budgets.find(b=>b.dept==="行政部")||DB.budgets[0];},
  budgetOk(amt,b){
    b=b||this.budgetOf();if(!b)return {ok:true,warn:false};
    const avail=+(Number(b.total||0)-Number(b.occupied||0)-Number(b.paid||0)).toFixed(2);
    if(amt<=avail+0.009)return {ok:true,warn:false,b,avail};
    if(RULES.budgetMode==="弱控")return {ok:true,warn:true,b,avail,msg:"预算弱控：可用 "+money(avail)+"，本次 "+money(amt)+"，允许继续但记预警"};
    return {ok:false,warn:true,b,avail,msg:"预算强控：可用 "+money(avail)+"，本次 "+money(amt)+"，已拦截"};
  },
  occupy(b,amt){if(!b)return;b.occupied=+(Number(b.occupied||0)+amt).toFixed(2);b.avail=+(Number(b.total||0)-b.occupied-Number(b.paid||0)).toFixed(2);},
  tolOk(a,b,pct){const t=(Number(pct)||0)/100;const base=Math.max(Math.abs(Number(a)||0),Math.abs(Number(b)||0),1);return Math.abs(Number(a)-Number(b))<=Math.max(0.01,base*t);}
};

const Run={
  active:null,
  note(ok,title,detail){if(!this.active)return;this.active.steps.unshift({ok,title,detail,time:nowStr()});},
  addDoc(kind,id,extra){if(!this.active)return;this.active.docs=this.active.docs.filter(d=>!(d.kind===kind&&d.id===id));this.active.docs.push({kind,id,extra:extra||""});},
  waitFor(doc,type,page){
    const n=Gate.pending(doc);const r=n&&roleById(n.roleId);
    this.active.wait={type,page,docId:docRef(doc),docName:doc.title||doc.name||doc.poNo||doc.ctNo||docRef(doc),roleId:n?n.roleId:"",roleName:r?r.name+" · "+r.title:(n?n.role:"")};

  block(msg){this.active.block=msg;this.note(false,"被规则拦住",msg);},
  start(id){
    if(this.active&&this.active.status==="running"){toast("请先点「清空业务单据」再开新场景","err");return;}
    resetTx();
    const sc=SCENARIOS.find(s=>s.id===id);

    toast("已开始场景「"+sc.name+"」","ok");

  clear(){resetTx();this.active=null;toast("业务单据已清空，主数据与规则保留","ok");if(cur==="bizRun")bizRunPage();else go("bizRun");},
  finish(pass,reason){
    if(!this.active)return;
    this.active.status=pass?"passed":"failed";this.active.result=reason;this.active.wait=null;
    this.note(pass,pass?"场景通过":"场景失败",reason);
    toast(pass?"场景通过："+reason:"场景失败："+reason,pass?"ok":"err");
    paintHelper();
  },
  recon(){
    const p=this.active&&this.pipeObj();if(!p)return {ok:true,lines:[]};
    const req=DB.reqOrders.find(x=>x.id===p.req);
    const plan=DB.plans.find(x=>x.id===p.plan);
    const o=DB.orders.find(x=>x.poNo===p.po);
    const rec=DB.recvs.find(x=>x.id===p.recv|| (o&&x.po===o.poNo));
    const inv=DB.invoices.find(x=>x.id===p.inv|| (o&&x.po===o.poNo));
    const pay=DB.pays.find(x=>x.id===p.pay|| (o&&x.po===o.poNo));
    const lines=[];let ok=true;
    const add=(t,good,d)=>{lines.push({t,good,d});if(!good)ok=false;};
    if(req&&plan) add("需求 vs 计划金额",Math.abs((req.amt||0)-(plan.budget||0))<0.02,money(req.amt)+" / "+money(plan.budget));
    if(o&&plan) add("计划 vs 订单金额",Math.abs((o.amount||0)-(plan.budget||0))<0.02,money(plan.budget)+" / "+money(o.amount));
    if(o){
      const q=o.qty||0,rq=o.recvQty||0,iq=o.inQty||0;
      add("收货不超过订单",rq<=q+1e-6,"订单 "+q+" / 收货 "+rq);
      add("入库不超过收货",iq<=rq+1e-6,"收货 "+rq+" / 入库 "+iq);
    }
    if(o&&inv&&inv.amount){
      const ratio=(o.qty? (o.inQty||o.recvQty||0)/o.qty : 1);
      const expect=+(o.amount*ratio).toFixed(2);
      add("发票金额 vs 实收金额（容差 "+RULES.tolAmt+"%）",Gate.tolOk(inv.amount,expect,RULES.tolAmt),money(expect)+" / 票 "+money(inv.amount));
      add("发票数量 vs 实收",Gate.tolOk(inv.qty,o.inQty||o.recvQty||0,RULES.tolQty),(o.inQty||o.recvQty||0)+" / 票 "+inv.qty);
      const sp=taxSplit(inv.amount,inv.rate);add("价税合计=未税+税额",Math.abs(sp.net+sp.tax-inv.amount)<0.05,money(inv.net||sp.net)+" + "+money(inv.tax||sp.tax));
    }
    if(pay&&inv) add("付款 vs 发票",Math.abs((pay.amount||0)-(inv.amount||0))<0.02,money(inv.amount)+" / 付 "+money(pay.amount));
    return {ok,lines};
  },
  pipeObj(){return this.active&&this.active.pipe&&DB.pipes.find(p=>p.id===this.active.pipe);},
  cont(){
    const A=this.active;if(!A||A.status!=="running"){toast("没有进行中的场景，请先点「开始」","err");return;}
    A.wait=null;A.block=null;
    const r=this.advance();
    if(r==="wait"){if(cur==="bizRun")bizRunPage();paintHelper();return;}
    if(r==="block"){this.evalBlock();if(cur==="bizRun")bizRunPage();paintHelper();return;}
    if(r==="done"){this.evalDone();if(cur==="bizRun")bizRunPage();paintHelper();return;}
    if(cur==="bizRun")bizRunPage();paintHelper();
  },
  evalBlock(){
    const A=this.active,why=A.block||"被拦截";
    if(A.expect==="blocked-budget"&&/预算/.test(why))this.finish(true,"按规则拦截成功。"+why);
    else if(A.expect==="blocked-match"&&/匹配|容差/.test(why))this.finish(true,"按规则拦截成功。"+why);
    else if(A.expect==="blocked-reject")this.finish(true,why);
    else if(A.expect==="complete")this.finish(false,"主路径不应被拦住："+why);
    else if(A.expect==="partial")this.finish(false,"部分收货场景被拦住："+why);
    else this.finish(false,why);
  },
  evalDone(){
    const A=this.active,p=this.pipeObj(),rc=this.recon();
    if(A.expect==="blocked-reject"){this.finish(false,"期望驳回拦截，但流程已走完");return;}
    if(A.expect==="blocked-match"){this.finish(false,"期望三单不符被拦，但已走完");return;}
    if(A.expect==="blocked-budget"){this.finish(false,"期望超预算被拦，但已走完");return;}
    if(A.expect==="partial"){
      const o=p&&DB.orders.find(x=>x.poNo===p.po);
      if(!o||!(o.recvQty>0)||o.recvQty>=o.qty){this.finish(false,"未形成部分收货");return;}
      const pay=DB.pays.find(x=>x.po===o.poNo);
      const expect=+(o.amount*(o.recvQty/o.qty)).toFixed(2);
      if(pay&&Math.abs(pay.amount-expect)>1){this.finish(false,"付款未按实收 "+money(expect));return;}
      this.finish(rc.ok,"部分收货按实收结算。"+(rc.ok?"金额数量一致。":"核对有差异。"));return;
    }
    const need=["req","plan","src","ct","po","recv","inv","ap","pay","vch"];
    const miss=need.filter(k=>p&&!p[k]);
    if(miss.length){this.finish(false,"单据断档，缺："+miss.join("、"));return;}
    this.finish(rc.ok,rc.ok?"主路径跑通，单据不断档且金额数量一致。":"主路径单据已齐，但金额/数量不一致。");
  },
  advance(){
    const A=this.active;
    let p=this.pipeObj();
    if(!p){
      const b=Gate.budgetOf();
      const avail=b?+(b.total-b.occupied-b.paid).toFixed(2):100000;
      const amt=A.id==="overrun"?Math.round(avail+80000):180000;
      const title=(A.id==="overrun"?"超预算验证采购":A.name+"验证采购")+"-"+nowStr().slice(5,16);
      const rid=Flow.nid("REQ");
      const req={id:rid,title,factory:"总部",dept:"行政部",applicant:"张明",date:nowStr().slice(0,10),amt,lines:1,status:"待审批",qty:A.id==="partial"?100:10};
      Gate.init(req,"reqOrder");DB.reqOrders.unshift(req);
      p=Flow.createPipe(title,rid);p.amount=amt;p.qty=req.qty;A.pipe=p.id;CTX.pipe=p.id;
      this.addDoc("需求单",rid);this.note(true,"已生成需求单",rid+" "+money(amt));
      this.waitFor(req,"reqOrder","reqOrder");return "wait";
    }
    const req=DB.reqOrders.find(x=>x.id===p.req);
    if(!req)return "block";
    if(Gate.isRejected(req)){A.block="需求单已驳回，下游不得生成。";return "block";}
    if(!Gate.isDone(req)){this.waitFor(req,"reqOrder","reqOrder");return "wait";}
    if(A.expect==="blocked-reject"){A.block="需求已通过，但本场景要求驳回。";return "block";}

    if(!p.plan){
      const chk=Gate.budgetOk(p.amount,Gate.budgetOf());
      if(!chk.ok){A.block=chk.msg;return "block";}
      if(chk.warn){A.warns.push(chk.msg);this.note(true,"预算预警",chk.msg);Msg.emit({type:"预警",title:"预算弱控预警",body:chk.msg,to:"李芳",page:"finBudget",level:"高",pipe:p.id});
        if(A.expect==="blocked-budget"){A.block=chk.msg+"（弱控放行）";this.finish(true,chk.msg);return "wait";}
      }
      const pid=Flow.nid("PLN");
      const plan={id:pid,name:req.title+"采购计划",buyer:"张明",method:p.amount>=500000?"招标":"询价",budget:p.amount,reqs:req.id,status:"待审核",srcId:"",pipe:p.id};
      Gate.init(plan,"purchasePlan");DB.plans.unshift(plan);p.plan=pid;req.planId=pid;req.status="已合并计划";
      this.addDoc("采购计划",pid);this.note(true,"已生成采购计划",pid);
      this.waitFor(plan,"purchasePlan","purchasePlan");return "wait";
    }
    const plan=DB.plans.find(x=>x.id===p.plan);
    if(Gate.isRejected(plan)){A.block="计划已驳回。";return "block";}
    if(!Gate.isDone(plan)){this.waitFor(plan,"purchasePlan","purchasePlan");return "wait";}
    if(!plan._occupied){
      const b=Gate.budgetOf();const chk=Gate.budgetOk(p.amount,b);
      if(!chk.ok){A.block=chk.msg;return "block";}
      Gate.occupy(b,p.amount);plan._occupied=true;p.bdg=b.id;b.pipe=p.id;b.ctrl=RULES.budgetMode;
      this.note(true,"预算占用",b.name+" "+money(p.amount));
    }
    if(A.expect==="blocked-budget"){this.finish(false,"超预算场景在强控下应被拦截，但预算已占用。");return "wait";}

    if(!p.src){
      Flow.toSourcing(plan);
      const src=DB.srcProjects.find(x=>x.id===p.src)||DB.srcProjects[0];
      if(src){src.status="已定标";}
      const winner="城建装饰公司";
      const aw={id:Flow.nid("AWD"),src:p.src,tender:(DB.tenders[0]||{}).id||"",winner,amount:p.amount,days:3,status:"已定标",project:req.title,pipe:p.id};
      DB.awards.unshift(aw);Flow.pushAward(aw);
      this.addDoc("寻源",p.src);this.addDoc("定标",aw.id);this.note(true,"寻源定标完成",winner+" "+money(p.amount));
    }
    if(!p.ct){

      if(prj&&prj.status!=="已确认")Flow.confirmProject(prj);

      o.qty=A.id==="partial"?100:10;o.status="待审批";o.finalized=true;o.approve="审批中";

    }
    const o=DB.orders.find(x=>x.poNo===p.po);
    if(Gate.isRejected(o)){A.block="订单已驳回。";return "block";}
    if(!Gate.isDone(o)){this.waitFor(o,"order","orderApprove");return "wait";}
    if(o.status==="待审批"||o.status==="草稿"){o.status="执行中";o.approve="通过";}

      const ratio=A.id==="partial"?0.4:1;

      this.addDoc("收货",p.recv||"");this.addDoc("运单",p.tms||"");
      this.note(true,A.id==="partial"?"部分收货完成":"收货入库完成","实收 "+o.recvQty+" / 订单 "+o.qty);
    }
    if(!p.inv||!(DB.invoices.find(i=>i.id===p.inv||i.po===o.poNo)||{}).amount){
      const ratio=(o.qty? (o.inQty||o.recvQty||0)/o.qty:1);
      let amt=+(o.amount*ratio).toFixed(2);
      if(A.id==="mismatch") amt=+(amt*(1+RULES.tolAmt/100+0.08)).toFixed(2);
      const inv=Fin.receiveInvoice(o,{amount:amt,qty:o.inQty||o.recvQty});
      inv.qty=o.inQty||o.recvQty||1;Fin.verify(inv);Fin.certify(inv);
      this.addDoc("发票",inv.id);this.note(true,"已收票并验真",inv.no+" "+money(inv.amount));
    }
    const mt=DB.matches.find(m=>m.po===o.poNo);
    const inv=DB.invoices.find(i=>i.po===o.poNo);
    if(mt&&mt.result!=="匹配通过"&&mt.result!=="匹配不符"){
      const ok=Fin.threeWay(mt);
      if(!ok){A.block="三单匹配不符：入库 "+money(mt.grAmt)+" / 发票 "+money(mt.invAmt)+"，容差 "+RULES.tolAmt+"%";return "block";}

    if(mt&&mt.result==="匹配不符"){A.block="三单匹配不符：入库 "+money(mt.grAmt)+" / 发票 "+money(mt.invAmt);return "block";}
    const pay=DB.pays.find(x=>x.po===o.poNo);
    if(!pay){A.block="匹配通过但未生成付款单";return "block";}
    if(!pay.nodes)Gate.init(pay,"payment");
    if(Gate.isRejected(pay)){A.block="付款已驳回。";return "block";}
    if(!Gate.isDone(pay)){pay.status="待审核";this.addDoc("付款",pay.id);this.waitFor(pay,"payment","finPay");return "wait";}
    if(pay.status!=="已支付"&&pay.status!=="已过账")Fin.executePay(pay);
    this.addDoc("凭证",p.vch||"");this.note(true,"付款过账完成",p.vch||pay.id);
    return "done";
  }
};

  approveOrder(o){

    o.status="执行中";o.approve="通过";o.finalized=true;

  },
  fulfill(o,ratio){
    if(o.nodes&&!Gate.isDone(o)){toast("订单未审批完成，不能履约收货","err");return;}
    ratio=ratio==null?1:Number(ratio);
    o.accepted="是";

    o.shippedQty=q;o.recvQty=q;o.inQty=q;o.shipped=q>=(o.qty||q)?"全部发货":"部分发货";o.recv="已收货";o.status="待结算";

    DB.dispatches.unshift({id:this.nid("DP"),tms,carrier:"顺达物流有限公司",vehicle:"沪A·D1001",driver:"司机甲",phone:"138****7788",time:nowStr(),status:"已完成"});

    DB.recvs.unshift(rec);
    const qc={id:this.nid("QC"),recv:rec.id,mat:o.material||"到货物料",sample:q,bad:0,inspector:"孙婷",result:"合格"};
    DB.qcs.unshift(qc);
    DB.ins.unshift({id:this.nid("IN"),qc:qc.id,wh:"华东一号仓",mat:o.material||qc.mat,qty:q,date:nowStr().slice(0,10),status:"已入库"});
    const p=DB.pipes.find(x=>x.po===o.poNo);if(p){p.tms=tms;p.recv=rec.id;this.set(p,7);}
    toast("已按实收 "+q+" 完成签收/质检/入库","ok");
  },
  vendorAccept(o){o.accepted="是";Msg.emit({type:"协同",title:"供应商已接单 "+o.poNo,body:o.supplier,to:o.buyer||"张明",page:"orderExec",refType:"订单",refId:o.poNo});toast("供应商已接单，可发送发货通知(ASN)","ok");},
  createAsn(o){
    if(o.nodes&&!Gate.isDone(o)){toast("订单未审批完成，不能发货","err");return;}

    o.shippedQty=(o.shippedQty||0)+qty;o.shipped=o.shippedQty>=o.qty?"全部发货":"部分发货";

  signTms(ts){

    const o=DB.orders.find(x=>x.poNo===ts.po);
    if(o){
      o.recvQty=o.shippedQty||o.qty||0;o.recv="已收货";
      let rec=DB.recvs.find(r=>r.po===o.poNo);
      if(!rec){rec={id:this.nid("REC"),po:o.poNo,supplier:o.supplier,plan:o.qty||1,actual:o.recvQty,date:nowStr().slice(0,10),status:"已送检"};DB.recvs.unshift(rec);}
      else{rec.actual=o.recvQty;rec.status="已送检";rec.date=nowStr().slice(0,10);}
      if(!DB.qcs.find(q=>q.recv===rec.id&&q.result==="待检"))DB.qcs.unshift({id:this.nid("QC"),recv:rec.id,mat:o.material||"到货物料",sample:o.recvQty||1,bad:0,inspector:ROLE.name,result:"待检"});
      const p=DB.pipes.find(x=>x.po===o.poNo);if(p){p.recv=rec.id;this.set(p,7);}
      const split=taxSplit(o.amount*((o.recvQty||0)/(o.qty||1)),(guessTax(o)||{rate:13}).rate);
      if(p&&!DB.vouchers.find(v=>v.po===o.poNo&&v.type==="暂估入库")){
        DB.vouchers.unshift({id:this.nid("VCH"),no:"记-"+nowStr().slice(0,10).replace(/-/g,"")+"-EST",date:nowStr().slice(0,10),type:"暂估入库",src:rec.id,po:o.poNo,amount:split.net,status:"已过账",pipe:p.id,lines:[{acc:"1403 库存商品/在建工程",dc:"借",amt:split.net},{acc:"2202 应付账款-暂估",dc:"贷",amt:split.net}]});
      }
      Msg.emit({type:"仓储",title:"已签收并送检 "+o.poNo,body:"请质检入库后收票匹配。",to:"孙婷",page:"wmsQc",pipe:p?p.id:"",refType:"收货单",refId:rec.id});
    }
    toast("签收完成，已生成收货/质检单与暂估凭证","ok");
  },
  settle(o){
    const recv=o.recvQty||0;
    if(recv<=0){toast("尚未收货，不能结算","err");return false;}
    let inv=DB.invoices.find(i=>i.po===o.poNo);
    if(!inv||!inv.amount){inv=Fin.receiveInvoice(o,{amount:Math.round(o.amount*((o.inQty||o.recvQty||o.qty)/ (o.qty||1)))});Fin.verify(inv);}
    else if(inv.verify==="待验真"||inv.verify==="未到票")Fin.verify(inv);
    const mt=DB.matches.find(m=>m.po===o.poNo)||{id:Flow.nid("MATC"),po:o.poNo,inv:inv.id,recv:(DB.recvs.find(r=>r.po===o.poNo)||{}).id,poAmt:o.amount,grAmt:0,invAmt:inv.amount,poQty:o.qty,grQty:o.inQty||o.recvQty,invQty:inv.qty,tol:"0.5%"};
    if(!DB.matches.find(m=>m.po===o.poNo))DB.matches.unshift(mt);
    const ok=Fin.threeWay(mt);
    if(ok)toast("已进入财税：三单匹配通过，请财务审核付款","ok");
    go("finMatch");
    return ok;
  }
};

function openModal(title,bodyHtml,onOk,wide){
  const mask=$("mask");mask.className="mask show";
  mask.innerHTML=`<div class="modal${wide?" wide":""}"><div class="modal-h"><h3>${title}</h3><button class="btn ghost sm" type="button" id="mx">×</button></div><div class="modal-b">${bodyHtml}</div><div class="modal-f"><button class="btn ghost" type="button" id="mc">取消</button><button class="btn" type="button" id="mo">确定</button></div></div>`;

  });

  });

  function getFiltered(){
    const fd=new FormData($("ff"));const obj={};for(const[k,v] of fd.entries())obj[k]=String(v).trim();
    UI.filter[id]=obj;return (cfg.getData?cfg.getData(obj):[]).filter(Boolean);
  }
  function refresh(){
    const all=getFiltered();const pages=Math.max(1,Math.ceil(all.length/(UI.size[id]||size)));
    if((UI.page[id]||page)>pages)UI.page[id]=pages;
    const p=UI.page[id]||1,s=UI.size[id]||size;const slice=all.slice((p-1)*s,p*s);
    $("cnt").textContent=`共 ${all.length} 条`;$("sum").textContent=all.length?`共 ${all.length} 条，第 ${p}/${pages} 页`:"共 0 条";
    $("tip").textContent=`当前显示 ${all.length} 条记录。`;
    $("tbod").innerHTML=slice.length?slice.map(row=>{
      const cells=cfg.columns.map(c=>`<td>${c.render?c.render(row):(row[c.key]??"—")}</td>`).join("");
      const ops=(cfg.rowActions||[]).filter(a=>!a.show||a.show(row)).map(a=>`<button class="btn ghost sm" type="button" data-a="${a.act}" data-i="${row.id}">${a.label}</button>`).join("");
      return `<tr>${cells}<td><div class="ops">${ops}</div></td></tr>`;
    }).join(""):`<tr><td colspan="${cfg.columns.length+1}" style="text-align:center;padding:28px;color:#94a3b8">暂无数据</td></tr>`;
    $("tbod").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      const row=all.find(x=>String(x.id)===String(b.dataset.i));cfg.onAction&&cfg.onAction(b.dataset.a,row,refresh);
    });
    const pg=$("pg");let nums="";const from=Math.max(1,Math.min(p-2,pages-4)),to=Math.min(pages,from+4);
    for(let i=from;i<=to;i++)nums+=`<button type="button" class="${i===p?"on":""}" data-p="${i}">${i}</button>`;
    pg.innerHTML=`<button type="button" data-nav="prev" ${p<=1?"disabled":""}>上一页</button>${nums}<button type="button" data-nav="next" ${p>=pages?"disabled":""}>下一页</button>

    pg.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{UI.page[id]=+b.dataset.p;refresh();});
    pg.querySelector("[data-nav=prev]").onclick=()=>{if((UI.page[id]||1)>1){UI.page[id]=(UI.page[id]||1)-1;refresh();}};
    pg.querySelector("[data-nav=next]").onclick=()=>{if((UI.page[id]||1)<pages){UI.page[id]=(UI.page[id]||1)+1;refresh();}};
    $("psz").onchange=()=>{UI.size[id]=+$("psz").value;UI.page[id]=1;refresh();};
  }
  $("ff").onsubmit=e=>{e.preventDefault();UI.page[id]=1;refresh();};
  $("ff").onreset=()=>setTimeout(()=>{UI.filter[id]={};UI.page[id]=1;refresh();$("tip").textContent="筛选条件已重置。";},0);
  refresh();
}

function match(obj,row,keys){
  for(const k of keys){const v=obj[k];if(!v)continue;const rv=String(row[k]??"");if(!rv.includes(v)&&rv!==v)return false;}
  return true;
}

  toolbar:[{label:"新建需求单",act:"add"}],rowActions:[{label:"提交审批",act:"submit",show:r=>r.status==="草稿"},{label:"通过",act:"pass",show:r=>r.status==="待审批"},{label:"驳回",act:"rej",show:r=>r.status==="待审批"},{label:"合并计划",act:"plan",show:r=>r.status==="已通过"}],
  getData:f=>DB.reqOrders.filter(r=>match(f,r,["id","title","factory","status"])),
  onAction:(a,row,ref)=>{
    if(a==="add")openModal("新建需求单",`<div class="field"><label>标题</label><input id="r1"></div><div class="field"><label>分厂</label><input id="r2" value="总部"></div><div class="field"><label>预估金额</label><input id="r3" type="number" value="80000"></div>`,()=>{const rid=Flow.nid("REQ");DB.reqOrders.unshift({id:rid,title:$("r1").value||"新需求单",factory:$("r2").value,dept:"业务部",applicant:ROLE.name,date:nowStr().slice(0,10),amt:+$("r3").value||0,lines:1,status:"草稿"});Flow.createPipe($("r1").value||"新需求单",rid).amount=+$("r3").value||0;toast("已创建并纳入采购管道","ok");ref();});
    if(a==="submit"){Gate.init(row,"reqOrder");row.status="待审批";const p=Flow.byReq(row.id);if(p)Flow.set(p,1);const n=Gate.pending(row);Msg.emit({type:"审批",title:"需求单 "+row.id+" 待审批",body:row.title+" "+money(row.amt),to:n?n.name:"周强",page:"reqOrder",pipe:p?p.id:"",level:"高",refType:"需求单",refId:row.id});toast("已提交审批，当前节点："+(n?n.name+" · "+n.role:""),"ok");ref();}

    if(a==="rej"){Flow.rejectReq(row);ref();}
    if(a==="plan"){Flow.makePlanFromReq(row);go("purchasePlan");}
  }});

function bindHelper(){
  const box=$("helper"),bar=$("helperBar"),min=$("helperMin");
  if(!box||!bar||!min)return;
  min.onclick=e=>{
    e.stopPropagation();
    box.classList.toggle("min");
    const on=box.classList.contains("min");
    min.textContent=on?"▢":"–";
    min.title=on?"展开":"收起";
  };
  let drag=null;
  bar.addEventListener("mousedown",e=>{
    if(e.button!==0||e.target.closest(".helper-min"))return;
    const r=box.getBoundingClientRect();
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top};
    box.classList.add("dragging");
    e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{
    if(!drag)return;
    const w=box.offsetWidth,h=box.offsetHeight;
    let x=e.clientX-drag.dx,y=e.clientY-drag.dy;
    x=Math.max(8,Math.min(window.innerWidth-w-8,x));
    y=Math.max(8,Math.min(window.innerHeight-h-8,y));
    box.style.left=x+"px";box.style.top=y+"px";box.style.right="auto";box.style.bottom="auto";
  });
  document.addEventListener("mouseup",()=>{if(!drag)return;box.classList.remove("dragging");drag=null;});
}

      <button class="btn ghost" type="button" id="clrRun">清空业务单据</button>
    </div>
    <div class="module-grid" style="padding-top:0">${SCENARIOS.map(s=>`<div class="mod" style="cursor:default"><h3>${s.name}</h3><p>${s.desc}</p></div>`).join("")}</div>
    ${A?`<div class="run-wait"><strong>${A.name} · ${badge(stMap[A.status]||A.status)}</strong>
      ${A.wait?`<p>当前卡点：${A.wait.docName}（${A.wait.docId}）<br>请切换角色 <b>${A.wait.roleName}</b>，到菜单「${(META[A.wait.page]||{}).title}」处理，然后回到本页点「继续跑」。</p>
        <button class="btn sm" type="button" id="goWait">打开待办页</button>`:(A.result?`<p>${A.result}</p>`:`<p>点击「继续跑」生成下一张单据。</p>`)}
      ${A.block?`<p class="bad-line">${A.block}</p>`:""}
      ${A.warns&&A.warns.length?`<p>预警：${A.warns.join("；")}</p>`:""}
    </div>
    <div class="board">
      <div class="panel"><h3>已生成单据</h3>
        ${A.docs.length?`<table class="data-table"><thead><tr><th>类型</th><th>单号</th></tr></thead><tbody>${A.docs.map(d=>`<tr><td>${d.kind}</td><td>${d.id}</td></tr>`).join("")}</tbody></table>`:"<p style='font-size:12px;color:#94a3b8'>尚未生成</p>"}
        <div style="margin-top:10px"><button class="btn ghost sm" type="button" id="goChain">全链路追溯</button></div>
      </div>
      <div class="panel"><h3>金额 / 数量核对</h3>
        ${rc.lines.length?rc.lines.map(l=>`<p class="${l.good?"ok-line":"bad-line"}">${l.good?"一致":"不一致"} · ${l.t} · ${l.d}</p>`).join(""):"<p style='font-size:12px;color:#94a3b8'>单据未齐，暂无对账</p>"}
      </div>
    </div>
    <div class="panel" style="margin:0 28px 24px"><h3>步骤日志</h3>
      <div class="tl">${(A.steps||[]).map(s=>`<div class="tl-item"><div><strong class="${s.ok?"ok-line":"bad-line"}">${s.title}</strong><span>${s.time} · ${s.detail||""}</span></div></div>`).join("")||"<span style='color:#94a3b8'>暂无</span>"}</div>
    </div>`:`<p style="padding:0 28px 24px;color:#64748b;font-size:13px">请选择一条标准场景并开始。开始后会清空当前业务单据（主数据和规则保留）。</p>`}
    </div>`;
  $("content").querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{
    if(Run.active&&Run.active.status==="running"){toast("请先清空再开新场景","err");return;}
    Run.start(b.dataset.sc);
  });
  $("contRun").onclick=()=>Run.cont();
  $("clrRun").onclick=()=>Run.clear();
  if($("goWait"))$("goWait").onclick=()=>go(A.wait.page);
  if($("goChain"))$("goChain").onclick=()=>{if(A.pipe)CTX.pipe=A.pipe;go("chain");};
}
function go(id){
  if(!META[id])id="home";
  cur=id;$("title").textContent=META[id].title;renderCrumb(id);setActive(id);
  if(id==="home")home();
  else if(id==="project")projectPage();
  else if(id==="chain")chainPage();
  else if(id==="orderExec")execPage();
  else if(id==="tplDraft")tplDraftPage();
  else if(id==="ctList"){listPage(CFG.ctList);injectCtMonitor();}
  else if(id==="rulesConfig")rulesConfigPage();
  else if(id==="bizRun")bizRunPage();
  else if(id==="msgInbox")msgInboxPage();
  else if(id==="msgChat")msgChatPage();
  else if(id==="finHome")finHomePage();
  else if(id==="finMatch")finMatchPage();
  else if(CFG[id])listPage(CFG[id]);
  else $("content").innerHTML=`<div class="card"><div class="page-shell"><h1>${META[id].title}</h1><p>页面配置缺失</p></div></div>`;
  paintHelper();paintBell();
  window.scrollTo(0,0);
  if(window.matchMedia("(max-width:720px)").matches){ $("app").classList.add("collapsed"); $("collapseBtn").textContent="☰"; }
}

$("collapseBtn").onclick=()=>{ $("app").classList.toggle("collapsed"); $("collapseBtn").textContent=$("app").classList.contains("collapsed")?"☰":"✕"; };
if($("sideMask"))$("sideMask").onclick=()=>{ $("app").classList.add("collapsed"); $("collapseBtn").textContent="☰"; };
if(window.matchMedia("(max-width:720px)").matches){ $("app").classList.add("collapsed"); $("collapseBtn").textContent="☰"; }
$("roleSel").innerHTML=ROLES.map(r=>`<option value="${r.id}">${r.name} · ${r.title}</option>`).join("");
$("roleSel").onchange=()=>{ROLE=ROLES.find(r=>r.id===$("roleSel").value)||ROLES[0];$("av").textContent=ROLE.name[0];$("un").textContent=ROLE.name+" · "+ROLE.title;paintHelper();paintBell();if(cur==="home")home();if(cur==="msgInbox")msgInboxPage();if(cur==="bizRun")bizRunPage();toast("已切换为 "+ROLE.title,"ok");};
$("bellBtn").onclick=e=>{e.stopPropagation();renderBellDrop();$("bellDrop").classList.toggle("show");};
document.addEventListener("click",e=>{if(!e.target.closest(".bell")&&!e.target.closest(".bell-drop"))$("bellDrop").classList.remove("show");});
buildNav();bindHelper();paintBell();go("home");
})();
</script>
</body>
</html>
